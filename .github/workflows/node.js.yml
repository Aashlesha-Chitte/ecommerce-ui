name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main  # or your default branch name

permissions:
  contents: write  # Gives the workflow write permission to the repository
  pages: write    # Allows deployment to GitHub Pages
  id-token: write # Allows the workflow to authenticate with GitHub Pages

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build  # Adjust this to your build directory
          publish_branch: gh-pages
